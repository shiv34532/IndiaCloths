<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Indian Cloths</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #d4a574;
      --secondary-color: #8b4513;
      --dark-bg: #1a1a1a;
    }
    body {
      background: linear-gradient(135deg, var(--dark-bg), #2a2a2a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .register-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      padding: 2rem;
      max-width: 450px;
      width: 100%;
    }
    .register-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 1rem;
    }
    .register-header h2 {
      color: var(--secondary-color);
      font-weight: 700;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(212, 165, 116, 0.25);
    }
    .btn-register {
      background: var(--primary-color);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.75rem;
    }
    .btn-register:hover {
      background: var(--secondary-color);
      color: white;
    }
    .btn-google {
      background: white;
      border: 2px solid #ddd;
      color: #555;
      font-weight: 600;
      padding: 0.65rem;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .btn-google:hover {
      border-color: var(--primary-color);
      background: #fafafa;
    }
    .divider-or {
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      margin: 0.75rem 0;
    }
    .divider-or::before, .divider-or::after {
      content: '';
      display: inline-block;
      width: 38%;
      height: 1px;
      background: #eee;
      vertical-align: middle;
    }
    .divider-or::before { margin-right: 0.5rem; }
    .divider-or::after  { margin-left:  0.5rem; }
    .auth-error {
      background: #fee;
      color: #c00;
      padding: .6rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: .9rem;
      display: none;
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
    }
    .login-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      color: var(--secondary-color);
    }
    .password-strength {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }
    .strength-weak { color: #dc3545; }
    .strength-fair { color: #ffc107; }
    .strength-good { color: #28a745; }
  </style>
</head>
<body>
<div class="register-container">
  <div class="register-header">
    <h2><i class="fas fa-sari me-2"></i>Indian Cloths</h2>
    <p class="lead mb-0">Create Your Account</p>
  </div>

  <div class="auth-error" id="authError"></div>

  <!-- Google Sign-Up -->
  <button class="btn-google" id="googleRegisterBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign up with Google
  </button>

  <div class="divider-or">or</div>

  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input id="fullName" type="text" class="form-control" placeholder="Your full name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-control" placeholder="your@email.com" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" placeholder="Min 8 characters" required>
      <div class="password-strength" id="strengthText"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input id="confirmPassword" type="password" class="form-control" placeholder="Re-enter password" required>
    </div>

    <button type="submit" class="btn btn-register w-100"><i class="fas fa-user-plus me-2"></i>Register</button>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-auth.js"></script>
<script>
  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  // Password strength indicator
  document.getElementById('password').addEventListener('input', (e) => {
    const pass = e.target.value;
    const strengthText = document.getElementById('strengthText');
    let strength = 0;
    if(pass.length >= 8) strength++;
    if(/[a-z]/.test(pass) && /[A-Z]/.test(pass)) strength++;
    if(/[0-9]/.test(pass)) strength++;
    if(/[!@#$%^&*]/.test(pass)) strength++;
    const labels  = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    const classes = ['', 'strength-weak', 'strength-fair', 'strength-good', 'strength-good'];
    strengthText.textContent = labels[strength] || 'Very Weak';
    strengthText.className = 'password-strength ' + (classes[strength] || 'strength-weak');
  });

  // Google Sign-Up
  document.getElementById('googleRegisterBtn').addEventListener('click', async () => {
    showError('');
    try {
      await signInWithGoogle();
      location.href = 'index.html';
    } catch (err) {
      if (err.code !== 'auth/popup-closed-by-user') {
        showError('Google sign-up failed: ' + (err.message || err.code));
      }
    }
  });

  // Email/Password Registration
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    showError('');
    const fullName       = document.getElementById('fullName').value.trim();
    const email          = document.getElementById('email').value.trim();
    const password       = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8)         return showError('Password must be at least 8 characters.');
    if (password !== confirmPassword) return showError('Passwords do not match.');

    try {
      await registerWithEmail(email, password, fullName);
      location.href = 'index.html';
    } catch (err) {
      const msgs = {
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/invalid-email':        'Invalid email address.',
        'auth/weak-password':        'Password is too weak.'
      };
      showError(msgs[err.code] || 'Registration failed: ' + (err.message || err.code));
    }
  });

  // Redirect if already signed in
  window.__onFirebaseAuthReady = (user) => {
    if (user) location.href = 'index.html';
  };
</script>
</body>
</html>
